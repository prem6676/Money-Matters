kind = "web"
previewPath = "/"
title = "Money Matters"
description = "A personal finance app for tracking income and expenses, reviewing transaction history, and managing account settings, with a separate admin view."
version = "1.0.0"
id = "artifacts/money-matters"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21091

[services.development]
run = "pnpm --filter @workspace/money-matters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/money-matters", "run", "build" ]
serve = "static"
publicDir = "artifacts/money-matters/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21091"
BASE_PATH = "/"
